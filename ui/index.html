<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AI 助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-message" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.8-.8L3 21l1.7-4.8A8.1 8.1 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/></symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="icon-tools" viewBox="0 0 24 24"><path d="m14.7 6.3 3 3M5 19l4.4-4.4M14 4l6 6-4 4-6-6 4-4ZM4 20l4-3-1-1-3 4Z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3ZM19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14ZM5 13l.7 1.8 1.8.7-1.8.7L5 18l-.7-1.8L2.5 15.5l1.8-.7L5 13Z"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </svg>

  <div class="chat-shell" id="app">
    <aside class="history-sidebar" aria-label="历史对话侧栏">
      <div class="sidebar-heading">
        <div><svg class="icon"><use href="#icon-history"></use></svg><span>历史对话</span></div>
        <small id="sidebar-count">0</small>
      </div>
      <button id="sidebar-new" class="button button-outline sidebar-new" type="button">
        <svg class="icon"><use href="#icon-plus"></use></svg><span>新建对话</span>
      </button>
      <div class="sidebar-label"><span>最近</span></div>
      <nav id="sidebar-history" class="history-list" aria-label="历史对话"></nav>
      <p id="sidebar-empty" class="history-empty">还没有历史对话。发送第一条消息后，会在这里保存。</p>
      <div class="sidebar-footer">
        <button id="delete-chat" class="button button-ghost danger-quiet" type="button" disabled>
          <svg class="icon"><use href="#icon-trash"></use></svg><span>删除当前对话</span>
        </button>
      </div>
    </aside>

    <main class="chat-workspace">
      <header class="chat-toolbar">
        <div class="chat-heading">
          <div class="chat-title-line">
            <h1 id="chat-title">AI 对话</h1>
            <span id="connection-dot" class="connection-dot" role="img" aria-label="助手状态读取中"></span>
          </div>
          <div class="model-row">
            <label for="model-select">对话模型</label>
            <select id="model-select" class="select" disabled>
              <option value="">正在读取模型…</option>
            </select>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="open-history" class="button button-ghost mobile-only" type="button" aria-label="历史对话" title="历史对话">
            <svg class="icon"><use href="#icon-history"></use></svg><span>历史对话</span>
          </button>
          <button id="new-chat" class="button button-ghost mobile-only" type="button" aria-label="新建对话" title="新建对话">
            <svg class="icon"><use href="#icon-plus"></use></svg><span>新建对话</span>
          </button>
          <a id="open-settings" class="button button-ghost" href="../settings/index.html" aria-label="AI 设置" title="AI 设置">
            <svg class="icon"><use href="#icon-settings"></use></svg><span>AI 设置</span>
          </a>
        </div>
      </header>

      <section class="workspace" aria-label="AI 对话">
        <div id="notices" class="notice-stack" aria-live="polite"></div>
        <div id="transcript" class="transcript" role="log" aria-label="对话内容">
          <div id="empty-state" class="empty-state">
            <div class="empty-mark"><svg class="icon"><use href="#icon-sparkles"></use></svg></div>
            <h2>今天，想让工作轻一点？</h2>
            <p>描述你的想法，让 AI 和插件一起完成。</p>
            <div class="suggestions">
              <button class="button button-outline" type="button" data-suggestion="我有哪些插件可以用？">发现可用工具</button>
              <button class="button button-outline" type="button" data-suggestion="打开 AI 批图，帮我规划白底商品图">规划商品图</button>
            </div>
            <button id="empty-tools" class="text-button" type="button"><span id="empty-tools-label">查看可调用工具</span><svg class="icon"><use href="#icon-chevron"></use></svg></button>
          </div>
          <div id="transcript-content" class="transcript-content"></div>
          <div id="transcript-end"></div>
        </div>

        <div class="composer-dock">
          <form id="composer-form">
            <div class="composer">
              <textarea id="message" class="composer-input" rows="1" maxlength="16000" placeholder="告诉我你想完成什么…" aria-label="消息"></textarea>
              <div class="composer-footer">
                <div class="composer-tools">
                  <span class="privacy-note"><svg class="icon"><use href="#icon-check"></use></svg>插件调用请在桌面确认</span>
                  <button id="open-tools" class="icon-button" type="button" aria-label="可调用工具" title="可调用工具">
                    <svg class="icon"><use href="#icon-tools"></use></svg>
                  </button>
                </div>
                <button id="send-button" class="icon-button icon-button-primary" type="submit" aria-label="发送" title="发送" disabled>
                  <svg class="icon"><use href="#icon-send"></use></svg>
                </button>
                <button id="cancel-button" class="icon-button cancel-button" type="button" aria-label="停止" title="停止生成" hidden>
                  <svg class="icon"><use href="#icon-stop"></use></svg>
                </button>
              </div>
            </div>
          </form>
          <p class="composer-hint">Enter 发送 · Shift + Enter 换行</p>
        </div>
      </section>
    </main>
  </div>

  <dialog id="history-dialog" class="modal" aria-labelledby="history-dialog-title">
    <div class="modal-card">
      <header class="modal-header">
        <div><h2 id="history-dialog-title">历史对话</h2><p>会话保存在本机，选择一个继续。</p></div>
        <button id="history-close" class="icon-button" type="button" aria-label="关闭历史对话"><svg class="icon"><use href="#icon-close"></use></svg></button>
      </header>
      <button id="history-dialog-new" class="button button-outline dialog-new" type="button">
        <svg class="icon"><use href="#icon-plus"></use></svg><span>新建对话</span>
      </button>
      <nav id="history-dialog-list" class="history-list dialog-history" aria-label="历史对话选择"></nav>
      <p id="history-dialog-empty" class="history-empty">还没有历史对话。</p>
    </div>
  </dialog>

  <dialog id="tools-dialog" class="modal" aria-labelledby="tools-dialog-title">
    <div class="modal-card modal-wide">
      <header class="modal-header">
        <div><h2 id="tools-dialog-title">可调用工具</h2><p>这里列出已启用插件的可用能力。每次调用都需要在桌面确认。</p></div>
        <button id="tools-close" class="icon-button" type="button" aria-label="关闭工具列表"><svg class="icon"><use href="#icon-close"></use></svg></button>
      </header>
      <div id="tools-list" class="tool-list"></div>
      <p id="tools-empty" class="history-empty" hidden>安装并启用插件后，助手才能调用。</p>
    </div>
  </dialog>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
